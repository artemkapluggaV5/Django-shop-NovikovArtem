{% extends 'catalog/base.html' %}
{% block content %}
<div class="container mt-4">
    <h1>Категории</h1>
    <a href="{% url 'category_create' %}" class="btn btn-success mb-3">Добавить категорию</a>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Slug</th>
                <th>Активна</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
        {% for cat in categories %}
            <tr>
                <td>{{ cat.id }}</td>
                <td>{{ cat.name }}</td>
                <td>{{ cat.slug }}</td>
                <td>{{ cat.is_active }}</td>
                <td>
                    <a href="{% url 'category_edit' cat.id %}" class="btn btn-primary btn-sm">Редактировать</a>
                    <a href="{% url 'category_delete' cat.id %}" class="btn btn-danger btn-sm">Удалить</a>
                </td>
            </tr>
        {% empty %}
            <tr><td colspan="5">Категорий нет</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
