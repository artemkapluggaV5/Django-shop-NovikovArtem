{% extends 'catalog/base.html' %}
{% block content %}
<div class="container mt-4">
    <h1>Форма категории</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Сохранить</button>
        <a href="{% url 'categories_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
