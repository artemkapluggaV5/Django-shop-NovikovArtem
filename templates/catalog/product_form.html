{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'product_list' %}">Товары</a></li>
            <li class="breadcrumb-item active text-truncate" style="max-width: 250px;">{{ product.name }}</li>
        </ol>
    </nav>

    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h1 class="h4 m-0">Редактирование товара: {{ product.name }}</h1>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="mt-4 border-top pt-3">
                    <button class="btn btn-success px-4">Сохранить изменения</button>
                    <a href="{% url 'product_list' %}" class="btn btn-secondary">Назад к списку</a>
                </div>
            </form>
        </div>
    </div>

    <div class="mt-5 p-4 border border-danger rounded bg-light">
        <h5 class="text-danger">Удаление товара</h5>
        <p class="text-muted small">Внимание! Это действие удалит товар из базы данных навсегда.</p>
        <form method="post">
            {% csrf_token %}
            <button name="delete" class="btn btn-outline-danger"
                    onclick="return confirm('Вы точно хотите безвозвратно удалить этот товар?')">
                Удалить этот товар
            </button>
        </form>
    </div>
</div>
{% endblock %}
