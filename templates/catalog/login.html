{% extends 'catalog/base.html' %} <!-- Или как называется твой основной шаблон -->

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">Вход</h3>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            {{ form.as_p }}
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill">Войти</button>
                    </form>
                    <div class="text-center mt-3">
                        <small>Нет аккаунта? <a href="{% url 'register' %}">Регистрация</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
