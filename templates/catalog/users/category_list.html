{% extends 'catalog/base.html' %}
{% load static %}

{% block content %}

<div class="hero-section text-white d-flex align-items-center mb-5" style="background: #343a40; padding: 3rem 0;">
    <div class="container text-center">
        <h1 class="display-4 fw-bold mb-3">Категории</h1>
        <p class="lead mb-4">Выберите нужную категорию</p>
    </div>
</div>

<div class="container mb-5">
    <div class="row g-4">

        {% for category in categories %}
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="card h-100 shadow-sm border-0 rounded-3">
                    {% if category.image %}
                        <img src="{{ category.image.url }}" class="card-img-top" alt="{{ category.name }}" style="object-fit: cover; height: 180px;">
                    {% else %}
                        <img src="{% static 'img/no-image.png' %}" class="card-img-top" alt="No image" style="object-fit: cover; height: 180px;">
                    {% endif %}
                    <div class="card-body d-flex flex-column justify-content-between">
                        <h5 class="card-title text-center">{{ category.name }}</h5>
                        <a href="{% url 'single-category' category.pk %}" class="btn btn-primary mt-3 w-100">
                            Перейти к категории →
                        </a>
                    </div>
                </div>
            </div>
        {% empty %}
            <div class="text-center">
                <p class="text-muted">Категории не найдены</p>
            </div>
        {% endfor %}

    </div>
</div>

{% endblock %}
