{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card border-danger mx-auto" style="max-width: 500px;">
        <div class="card-body text-center">
            <h3 class="text-danger">Удалить товар?</h3>
            <p>Вы уверены, что хотите удалить <strong>"{{ object.name }}"</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Подтвердить удаление</button>
                <a href="{% url 'product_list' %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
