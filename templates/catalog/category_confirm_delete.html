{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-4 text-center">
    <div class="card border-danger mx-auto" style="max-width: 500px;">
        <div class="card-body">
            <h1 class="text-danger">Удалить категорию?</h1>
            <p class="lead">Вы собираетесь удалить категорию <strong>"{{ category.name }}"</strong>.</p>
            <p class="text-muted">Это действие нельзя отменить.</p>
            
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-lg w-100 mb-2">Да, удалить навсегда</button>
                <a href="{% url 'categories' %}" class="btn btn-secondary w-100">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
